<title>Planșe OSPE Farmacologie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Douăzeci de variante OSPE de farmacologie generală, după baremele reale: trei subiecte, 9 puncte, 7 minute, cu barem de autocorectare și trimiteri la LP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Planșe (sistemul de design „Planșe”), disciplina farmacologie: raft de variante → planșă cu fișa student și baremul, lângă cronometru și scor. */
:root{
 --bg:#f2f1f6;--surface:#ffffff;--surface-2:#e9e7f1;--ink:#1d1a2c;--muted:#5d5973;--line:#d8d5e3;
 --accent:#3b2d91;--accent-soft:#e3dff7;--on-accent:#ffffff;--required:#c42f66;--required-soft:#fbe2eb;
 --discipline:#7a5a00;--discipline-soft:#f6eccb;--ok:#17744a;--ok-soft:#dcf1e5;--frost:#f7f8fa;--stage:#0f0d16;--highlight:rgba(255,226,0,.45);--quote-rule:#f2b705;
 --shadow:0 1px 2px rgba(29,26,44,.06),0 12px 28px -20px rgba(29,26,44,.45);
 --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
 --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121019;--surface:#1a1724;--surface-2:#242031;--ink:#ece9f6;--muted:#a39eb8;--line:#312c42;
 --accent:#afa2ff;--accent-soft:#2a2550;--on-accent:#15112e;--required:#ff7ea8;--required-soft:#3d1b29;
 --discipline:#e6be4a;--discipline-soft:#352a0c;--ok:#5ed39a;--ok-soft:#14321f;--frost:#2a2836;--stage:#07060b;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.9);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121019;--surface:#1a1724;--surface-2:#242031;--ink:#ece9f6;--muted:#a39eb8;--line:#312c42;
 --accent:#afa2ff;--accent-soft:#2a2550;--on-accent:#15112e;--required:#ff7ea8;--required-soft:#3d1b29;
 --discipline:#e6be4a;--discipline-soft:#352a0c;--ok:#5ed39a;--ok-soft:#14321f;--frost:#2a2836;--stage:#07060b;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.9);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* raft */
.masthead{padding-block:28px 10px;display:grid;gap:14px}
.masthead h1{font-size:clamp(1.9rem,5.4vw,3.1rem);font-weight:800}
.masthead h1 i{font-style:normal;color:var(--discipline)}
/* întoarcere la hub (designul Planșe: HubLink) */
.hub{display:inline-flex;align-items:center;gap:6px;width:max-content;min-height:36px;margin:-6px 0 -10px -8px;padding:0 10px 0 8px;border-radius:8px;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.03em;color:var(--accent);text-decoration:none}
.hub:hover{background:var(--accent-soft)}
.lede{color:var(--muted);max-width:66ch;margin:0}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
.seg{display:inline-flex;gap:3px;background:var(--surface-2);border-radius:11px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted);white-space:nowrap;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chapter{padding-block:22px 6px}
.chapter>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.chapter h2{font-size:1.35rem;font-weight:700}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
.jar{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .18s ease,border-color .18s ease;min-width:0}
.jar:hover{transform:translateY(-2px);border-color:var(--accent)}
.jar .ph{position:relative;aspect-ratio:16/7;background:var(--discipline-soft);overflow:hidden}
.jar .glyph{position:absolute;inset:0;display:grid;place-items:center;color:var(--discipline);font-family:var(--f-display);font-weight:800;font-size:2.6rem;letter-spacing:-.01em;line-height:1}
.jar .ph .done{position:absolute;right:10px;top:10px;font:600 .7rem/1 var(--f-mono);padding:4px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.jar .body{padding:12px 14px 4px;display:grid;gap:4px;flex:1}
.jar h3{font-size:1.06rem;font-weight:700}
.jar .org{color:var(--muted);font-size:.86rem;line-height:1.35}
.label{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:5px;background:var(--frost);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.tag.k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--discipline)}
.disc{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:5px;background:var(--discipline-soft);color:var(--discipline);white-space:nowrap}
.disc::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--discipline)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;color:var(--muted);font-size:.92rem}
.steps li b{color:var(--ink);font-weight:600}
.steps .n{font:600 .78rem/1 var(--f-mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-top:1px}
.foot{padding-block:28px 60px;color:var(--muted);font-size:.86rem;display:grid;gap:8px}.foot>div{max-width:80ch}

/* planșă */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;padding-block:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.9rem;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.icon{padding:7px 10px;min-width:38px;justify-content:center}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:default}
.bar .ttl{flex:1 1 140px;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.78rem;flex-wrap:wrap}
.score .pill{padding:4px 8px;border-radius:999px;background:var(--surface-2);font-weight:600;font-variant-numeric:tabular-nums}
.score .pill.pass{background:var(--ok-soft);color:var(--ok)}
.score .pill.fail{background:var(--required-soft);color:var(--required)}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--required);color:var(--required)}
.timer.out{background:var(--required-soft);border-color:var(--required);color:var(--required)}
.plansa{display:grid;gap:22px;padding-block:18px 60px;grid-template-columns:minmax(0,1fr);max-width:880px;margin-inline:auto}
.head{display:grid;gap:6px}
.head h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800}
.head .sub{color:var(--muted);font-size:.92rem}

/* fișa */
.fisa{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fisa .fh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fisa .fh b{font-family:var(--f-display);font-size:1.05rem}
.fisa .fh .meta{color:var(--muted);font-size:.86rem;flex-basis:100%}
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec>h3{font-family:var(--f-body);font-size:.92rem;font-weight:600;padding:10px 16px;background:var(--surface-2);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sec>h3 .pts{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-weight:600}
.stem{padding:12px 16px 4px;margin:0;max-width:70ch}
.qs{list-style:none;margin:0;padding:6px 16px 14px;display:grid;gap:12px}
.qs>li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:4px 6px}
.qs .lt{font-family:var(--f-mono);font-weight:600;color:var(--muted);padding-top:1px}
.qs .qt{min-width:0}
.pt{font-family:var(--f-mono);font-weight:600;font-size:.86em;white-space:nowrap}
.qs textarea{grid-column:2;width:100%;min-height:3.2em;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.94rem;line-height:1.45}
.qs textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.important{margin:0;padding:14px 16px;border-top:1px solid var(--line);background:var(--required-soft);display:grid;gap:2px}
.important b{color:var(--required);font-family:var(--f-mono);letter-spacing:.06em;font-size:.8rem}
.important p{margin:0;font-size:.92rem}
.important .t{color:var(--required);font-weight:600}

/* barem */
.bt{display:grid}
.br{display:grid;grid-template-columns:2.2rem minmax(0,1fr) repeat(3,3.1rem) 7.6rem;border-top:1px solid var(--line);align-items:stretch}
.br>div{padding:9px 8px;min-width:0}
.br .c{text-align:center;font-family:var(--f-mono);font-size:.86rem;font-variant-numeric:tabular-nums;border-left:1px solid var(--line)}
.br .c.mx{background:var(--surface-2);font-weight:600}
.br .et{border-left:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center}
.br .nr{font-family:var(--f-mono);font-weight:600;text-align:center}
.br.th{background:var(--surface-2);font-weight:600;font-size:.84rem;border-top:0}
.br.th .c{font-family:var(--f-body);font-size:.78rem;font-weight:600;background:transparent}
.br.th .c small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.br.sh{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.br.sh .act{display:grid;gap:4px}
.br.sh .st{color:var(--muted);font-size:.86rem;max-width:70ch}
.br.sh .sum{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted)}
.act{display:grid;gap:5px}
.act .ans{display:block}
.act .acc,.act .nn{font-size:.84rem;color:var(--muted)}
.act .srcs{display:flex;flex-wrap:wrap;gap:5px}
.src-k{font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--accent);background:var(--surface);white-space:nowrap}
.src-k.o{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.mine{font-size:.86rem;background:var(--accent-soft);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.mine b{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block}
.pick{display:inline-flex;gap:3px;background:var(--surface-2);border-radius:9px;padding:3px}
.pick button{appearance:none;border:0;background:transparent;border-radius:7px;min-width:30px;min-height:32px;padding:4px 6px;font:600 .78rem/1 var(--f-mono);cursor:pointer;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.br.bonus .act .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;color:var(--accent);font-weight:600}
.br.bonus .ans{color:var(--accent)}
.br.tot{font-weight:600;font-size:.92rem}
.br.tot .span{grid-column:1/-2;padding-left:12px}
.br.tot .val{border-left:1px solid var(--line);text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.br.tot.of .span{color:var(--required)}
.rule{margin:0;padding:12px 16px;border-top:1px solid var(--line);color:var(--required);font-size:.86rem}
.rule b{font-weight:600}
.sign{display:grid;gap:10px;padding:14px 16px;border-top:1px solid var(--line);font-size:.9rem;font-weight:600}
.sign span{font-weight:400;color:var(--muted)}
.practice .ans{filter:blur(6px);opacity:.55;transition:filter .2s,opacity .2s;cursor:pointer;user-select:none}
.practice .ans.shown{filter:none;opacity:1;cursor:auto;user-select:auto}
.practhint{display:none;padding:10px 16px;font-size:.86rem;background:var(--accent-soft);color:var(--ink)}
.practice .practhint{display:block}
@media (prefers-reduced-motion:reduce){.jar,.practice .ans{transition:none}}
@media (max-width:640px){
 .br{grid-template-columns:1.8rem minmax(0,1fr)}
 .br .c{display:none}
 .br .et{grid-column:2/-1;border-left:0;justify-content:flex-start;padding-top:0}
 .br.th .et{display:none}
 .br.tot{grid-template-columns:minmax(0,1fr) auto}
 .br.tot .span{grid-column:auto}
 .br.tot .val{min-width:5rem}
 .pick::before{content:"puncte";font:500 .7rem/32px var(--f-mono);color:var(--muted);padding:0 6px}
}
/* matrice */
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.mx{border-collapse:collapse;width:100%;min-width:1180px;font-size:.88rem}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
.mx thead th{background:var(--surface-2);font:600 .78rem/1.2 var(--f-mono);position:sticky;top:0}
.mx th[scope="row"],.mx td.nm{text-align:left;font-weight:500}.mx th[scope="row"]{width:1%}
.mx td.nm{color:var(--muted);font-size:.84rem}
.mx .grp th{background:color-mix(in srgb,var(--discipline-soft) 70%,var(--surface));text-align:left;font:600 .74rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--discipline)}
.mx .hit{display:inline-grid;place-items:center;width:1.7rem;height:1.4rem;border-radius:5px;background:var(--accent-soft);color:var(--accent);font:600 .7rem/1 var(--f-mono)}
.mx .zero th,.mx .zero td.nm{color:var(--required)}
.mx tfoot td,.mx tfoot th{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface-2)}
a.vl{color:inherit;text-decoration:none}a.vl:hover{color:var(--accent)}

/* tipar */
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 32px;max-width:820px;margin:0 auto 22px;font-size:14px;line-height:1.45}
.paper .ph1{font-weight:600;margin:0}
.paper h2{font-family:var(--f-body);color:#1f5fa8;text-align:center;font-size:17px;margin:14px 0 2px}
.paper .vx{color:#1f5fa8;text-align:center;font-weight:700;margin:0 0 14px}
.paper ol.pq{margin:0;padding-left:20px;display:grid;gap:10px}
.paper ol.pq ol{list-style:lower-alpha;padding-left:22px;margin:6px 0 0;display:grid;gap:3px}
.paper .imp{border-top:2px solid #1f5fa8;margin-top:18px;padding-top:8px}
.paper .imp b{color:#1f5fa8}.paper .red{color:#c0161f;font-weight:700}
.paper table{border-collapse:collapse;width:100%;font-size:12.5px}
.paper td,.paper th{border:1px solid #333;padding:4px 6px;vertical-align:top}
.paper th{font-weight:700}
.paper td.c{text-align:center;width:42px}.paper td.c.g{background:#c8c8c8;font-weight:700}
.paper tr.s td{background:#dbe3f1;font-weight:700}
.paper .blue{color:#1f5fa8}
.paper .rule{color:#c0161f;border:0;padding:8px 0 0;font-size:12px}
.paper .sg{margin-top:14px;font-weight:700}
.paper .pn{color:#555;font-size:11px}
.tip-note{color:var(--muted);font-size:.9rem;max-width:70ch;margin:0 auto 18px}

/* trimiteri la sursă: popup cu slide-ul sau pagina, pasajul marcat cu galben, fără chenar */
button.src{appearance:none;background:var(--surface);font-family:var(--f-mono);font-size:.68rem;font-weight:500;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--accent);white-space:nowrap;cursor:pointer;line-height:1.5}
button.src:hover{border-color:var(--accent);background:var(--accent-soft)}
button.src.r{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pop{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--stage) 55%,transparent);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.pop-in{width:min(100%,60rem);max-height:100%;height:min(100%,56rem);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line)}
.pop-h>div:first-child{flex:1 1 auto;min-width:0}
.vt .eyebrow,.vt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt b{font-family:var(--f-display);font-weight:700}
.pop-act{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.pop-b{overflow:auto;min-height:0;flex:1 1 auto;padding:12px;display:grid;gap:10px;align-content:start;background:var(--surface-2)}
.pq{margin:0;padding:8px 12px;border-left:4px solid var(--quote-rule);background:var(--surface);border-radius:0 8px 8px 0;font-size:.92rem}
.vq{display:grid;gap:8px}
.rx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.rx p{margin:4px 0 0;font-size:.92rem}
.rx mark{background:var(--highlight);color:inherit;border-radius:3px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.82rem}
#vnote{min-height:1.2em}
.slide{position:relative;margin:0 auto;width:100%;max-width:100%;background:#fff;box-shadow:var(--shadow)}
.slide.rpage{max-width:46rem}
.slide img{display:block;width:100%;height:auto}
.slide.big{width:200%;max-width:none}
.slide.rpage.big{width:min(200%,92rem)}
.slide .hl{position:absolute;background:var(--highlight);border:0;border-radius:3px;mix-blend-mode:multiply;pointer-events:none}
.pop-in.txt{height:auto}
.pnote{margin:0;font-size:.82rem;color:var(--muted)}

@media (max-width:520px){.pager>[data-nav] span{display:none}.pop{padding:0}.pop-in{width:100%;height:100%;border-radius:0;border:0}.pop-b{padding:8px}.pager .pg{min-width:8rem}}

}

<div id="app"></div>

<script>
/*DATA*/
const SURSE=/*SURSE*/;
const SURSE_IMG=/*IMG*/true;
</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const app=$("#app");
const fmt=x=>String(x).replace(".",",");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ptsHtml=s=>esc(s).replace(/\((\d+(?:,\d+)?) p\)/g,'<b class="pt">($1 p)</b>');
const LET="abcdefgh";
const DOM={FC:"Farmacocinetică",FD:"Farmacodinamie",FT:"Farmacotoxicologie"};
const subMax=s=>s.items.reduce((a,i)=>a+i.p[2],0);
const domPts=v=>{const d={FC:0,FD:0,FT:0};v.subiecte.forEach(s=>d[s.dom]+=subMax(s));return d};
const srcChip=t=>`<span class="src-k${t.startsWith("OSPE")?" o":""}">${esc(t)}</span>`;
const refLabel=(key,t)=>{const r=SURSE.refs[key+"|"+t];if(!r)return t;return r.d==="ospe"?`OSPE p.${r.p}`:`LP ${r.d.slice(2)} p.${r.p}`};
const srcBtn=(key,t)=>{const r=SURSE.refs[key+"|"+t];const tl=r?(r.d==="ospe"?`Deschide materialul OSPE la pagina ${r.p}`:`Deschide LP ${r.d.slice(2)}, slide-ul ${r.p}`):t;
 return `<button type="button" class="src${t.startsWith("OSPE")?" r":""}" data-ref="${esc(key+"|"+t)}" title="${esc(tl)}">${esc(refLabel(key,t))}</button>`};

/* stare per cititor: răspunsuri scrise și autoevaluare */
let store={ans:{},sc:{}};
try{const r=localStorage.getItem("ospe-farma-v1");if(r)store=Object.assign(store,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("ospe-farma-v1",JSON.stringify(store))}catch(e){}};

/* cronometru (7 minute, ca la examen) */
const T={left:420,run:false,id:null,v:null};
function tStr(){const m=Math.floor(T.left/60),s=T.left%60;return m+":"+String(s).padStart(2,"0")}
function tPaint(){const b=$("#tbtn");if(!b)return;
 b.classList.toggle("low",T.left<=60&&T.left>0);b.classList.toggle("out",T.left===0);
 b.querySelector(".tv").textContent=T.left===0?"timp expirat":tStr();
 b.querySelector(".tl").textContent=T.left===0?"":T.run?"Pauză":(T.left<420?"Reia":"Pornește");
 const r=$("#treset");if(r)r.hidden=T.left===420&&!T.run}
function tToggle(){if(T.left===0)return;T.run=!T.run;
 if(T.run){T.id=setInterval(()=>{T.left=Math.max(0,T.left-1);if(T.left===0){clearInterval(T.id);T.run=false}tPaint()},1000)}
 else clearInterval(T.id);tPaint()}
function tReset(){clearInterval(T.id);T.run=false;T.left=420;tPaint()}

/* rute: #v3 (fișă), #v3-barem, #matrice, #tipar */
function route(){const h=location.hash.slice(1);
 let m=h.match(/^v(\d+)(?:-(barem))?$/);
 if(m){const v=VARIANTE.find(x=>x.id==m[1]);if(v){if(T.v!==v.id){tReset();T.v=v.id}return plate(v,m[2]?"barem":"fisa")}}
 if(h==="matrice")return shelf("matrice");
 if(h==="tipar")return shelf("tipar");
 shelf("variante")}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});

function shelf(tab){
 const tabs=[["variante","Variante"],["matrice","Matrice de acoperire"],["tipar","Pentru tipar"]];
 let body="";
 if(tab==="variante")body=shelfBody();else if(tab==="matrice")body=matrixBody();else body=printBody();
 app.innerHTML=`<header class="masthead wrap">
  <a class="hub" href="https://budualexandru29-coder.github.io/HUB/">← Toate simulatoarele</a>
  <div class="eyebrow">Farmacologie · Modulul 1 · Anul II MG · O.S.P.E.</div>
  <h1>Planșe <i>Farmacologie</i></h1>
  <p class="lede">Douăzeci de variante de OSPE construite după modelul de la LP 4 și după baremele reale: trei subiecte, 9 puncte, 7 minute, plus punctul bonus pe cascada moleculară. Cazurile nu numesc medicamente; îți dau proprietăți (afinitate, activitate intrinsecă, tip de receptor, lipofilie, inductor sau inhibitor) și tu deduci efectul.</p>
 </header>
 <nav class="tools" aria-label="Secțiuni"><div class="wrap"><div class="seg" role="group" aria-label="Secțiune">
  ${tabs.map(([k,l])=>`<button type="button" data-tab="${k}" aria-pressed="${k===tab}">${l}</button>`).join("")}
 </div></div></nav>
 <main class="wrap">${body}</main>
 <footer class="foot wrap"><div>Sursa unică a baremelor: textul din LP 1–4 (Introducere – Farmacocinetică, Farmacodinamie, Farmacotoxicologie) și Materialul OSPE Farmacologie generală 2026–2027. Fiecare rând de barem trimite la slide-ul din LP (<span class="src-k">LP 3 p.10</span>) sau la pagina din material (<span class="src-k o">OSPE p.14</span>); atinge trimiterea ca să vezi pasajul evidențiat.</div><div>Material de exersare, pentru uz intern. Nu înlocuiește baremul oficial al disciplinei.</div></footer>`;
 app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab==="variante"?"":b.dataset.tab;if(b.dataset.tab==="variante")route()});
}

function shelfBody(){
 return `<section class="chapter"><header><h2>Cum lucrezi o variantă</h2></header>
 <ol class="steps"><li><span class="n">1</span><span><b>Pornește cronometrul</b> pe fișa student și scrie răspunsurile în 7 minute, fără material.</span></li>
 <li><span class="n">2</span><span><b>Treci la barem.</b> Răspunsurile tale apar sub fiecare rând, lângă răspunsul acceptat.</span></li>
 <li><span class="n">3</span><span><b>Punctează-te</b> cu 0, parțial sau maxim, ca examinatorul. Scorul și nota estimată se adună în bară.</span></li></ol></section>
 <section class="chapter"><header><h2>Variante</h2><span class="disc">Farmacologie</span></header>
 <div class="shelf">${VARIANTE.map(v=>{const d=domPts(v);const sc=store.sc[v.id];const done=sc&&Object.keys(sc).length;
  return `<a class="jar" href="#v${v.id}"><div class="ph"><span class="glyph">V${v.id}</span>${done?`<span class="done">✓ ${fmt(scoreOf(v).pts)} p</span>`:""}</div>
  <div class="body"><h3>${esc(v.titlu)}</h3></div>
  <div class="label">${v.subiecte.map(s=>`<span class="tag k">${s.dom} ${fmt(subMax(s))} p</span>`).join("")}</div></a>`}).join("")}</div></section>`;
}

/* matrice de acoperire: cazurile din LP × variante */
const CAT=[
 ["LP 1","Farmacocinetică – absorbție, distribuție",[["LP 1 · c1","Peptid administrat oral"],["LP 1 · c2","Bioechivalență (Cmax, Tmax, AUC)"],["LP 1 · c3","Legarea de calciu la absorbție"],["LP 1 · c4","Bariera hematoencefalică"],["LP 1 · c5","Volum aparent de distribuție"],["LP 1 · c6","Substanță lipofilă la pacient obez"],["LP 1 · c7","Deplasare de pe proteinele plasmatice"],["LP 1 · Proteine de legare","Hipoalbuminemie, SHBG/TBG"],["LP 1 · Efectul primului pasaj","Primul pasaj hepatic"],["LP 1 · Biodisponibilitatea","Calculul biodisponibilității"],["LP 1 · De reținut","Condiții de traversare a membranelor"]]],
 ["LP 2","Farmacocinetică – metabolizare, eliminare",[["LP 2 · c1","Inductor enzimatic + substrat"],["LP 2 · c2","Autoinducție enzimatică"],["LP 2 · c3","Inhibitor enzimatic + substrat"],["LP 2 · c4","Prodrug + inhibitor enzimatic"],["LP 2 · c5","pH urinar, acid slab"],["LP 2 · c6","Timp de înjumătățire, prize"],["LP 2 · c7","Cinetică, insuficiență renală"],["LP 2 · Tipuri de cinetică","Cinetică de ordinul I vs. 0"],["LP 2 · Excreția","Filtrare, secreție, reabsorbție tubulară"],["LP 2 · Metabolizarea","Enzime microzomiale și nemicrozomiale"],["LP 2 · Consecințe","Tabelul consecințelor inductor/inhibitor"]]],
 ["LP 3","Farmacodinamie – receptori cuplați cu proteine G",[["LP 3 · c1","Potență vs. eficacitate"],["LP 3 · c2","Antagonist competitiv în supradoză"],["LP 3 · c3","Agonist β2 (Gs)"],["LP 3 · c4","Antagonist β1 (Gs)"],["LP 3 · c5","Agonist M1,3 pe intestin izolat"],["LP 3 · c6","Secreția salivară"],["LP 3 · c7","Pupilă și presiune intraoculară"],["LP 3 · Receptori enzime","Receptorul tirozin-kinazic (insulina)"],["LP 3 · Interacțiunea ligand-receptor","Afinitate, activitate intrinsecă, tipuri de liganzi"],["LP 3 · tabel Rp colinergici","Tabelul receptorilor colinergici"],["LP 3 · tabel Rp adrenergici","Tabelul receptorilor adrenergici"]]],
 ["LP 4","Farmacodinamie – canale ionice, intracelulari; farmacotoxicologie",[["LP 4 · c1","Agonist GABA-A (canal de Cl⁻)"],["LP 4 · c2","Receptori N2, curarizante"],["LP 4 · c3","Tahifilaxie"],["LP 4 · c4","Down-regulation, toleranță, dependență"],["LP 4 · c5","Up-regulation, rebound"],["LP 4 · c6","Idiosincrazie"],["LP 4 · c7","Anafilaxie, glucocorticoizi"],["LP 4 · Reacții adverse","Clasificarea reacțiilor adverse"]]]
];
const hits=(v,key)=>{let n=0;v.subiecte.forEach(s=>s.items.forEach(i=>i.src.forEach(t=>{if(t===key||t.startsWith(key+".")||t.startsWith(key+" "))n++})));v.bonus.src.forEach(t=>{if(t===key||t.startsWith(key+".")||t.startsWith(key+" "))n++});return n};
function matrixBody(){
 const cols=VARIANTE.map(v=>`<th scope="col"><a class="vl" href="#v${v.id}-barem">V${v.id}</a></th>`).join("");
 let rows="",zero=[];
 CAT.forEach(([lp,nm,cases])=>{rows+=`<tr class="grp"><th colspan="${VARIANTE.length+2}">${lp} · ${nm}</th></tr>`;
  cases.forEach(([k,n])=>{const hs=VARIANTE.map(v=>hits(v,k));const tot=hs.reduce((a,b)=>a+b,0);if(!tot)zero.push(k+" – "+n);
   rows+=`<tr${tot?"":' class="zero"'}><th scope="row" class="mono" style="font-size:.78rem;white-space:nowrap">${k.replace(lp+" · ","")}</th><td class="nm">${n}</td>${hs.map(h=>`<td>${h?`<span class="hit">${h}</span>`:""}</td>`).join("")}</tr>`})});
 const foot=["FC","FD","FT"].map(k=>`<tr><th scope="row" colspan="2" style="text-align:left">Puncte ${DOM[k].toLowerCase()}</th>${VARIANTE.map(v=>`<td>${fmt(domPts(v)[k])}</td>`).join("")}</tr>`).join("")+
  `<tr><th scope="row" colspan="2" style="text-align:left">Total</th>${VARIANTE.map(v=>`<td>${fmt(v.subiecte.reduce((a,s)=>a+subMax(s),0))}</td>`).join("")}</tr>`;
 return `<section class="chapter"><header><h2>Matrice de acoperire</h2><span class="eyebrow">cifra = rânduri de barem care trimit la caz</span></header>
 <p class="lede" style="margin-bottom:14px">Fiecare variantă are un subiect de farmacocinetică, unul de farmacodinamie și unul de farmacotoxicologie, între 2 și 4,5 puncte fiecare, ca dificultatea să fie comparabilă. Modelul de la LP 4 împarte 2 / 5 / 2 puncte.</p>
 <div class="mx-wrap"><table class="mx"><thead><tr><th scope="col">Caz</th><th scope="col" style="text-align:left">Temă</th>${cols}</tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>
 ${zero.length?`<p class="lede" style="margin-top:14px"><b style="color:var(--required)">Neacoperite de aceste variante:</b> ${zero.map(esc).join("; ")}. Recapitulează-le direct din LP.</p>`:""}</section>`;
}

/* fișa student */
function fisaHtml(v){
 return `<article class="fisa" id="fisa">
 <div class="fh"><b>O.S.P.E. – Fișă student · V${v.id}</b><span class="disc">Farmacologie</span><span class="meta">Facultatea de Medicină · Anul 2 · Modulul 1 · Disciplina: Farmacologie</span></div>
 ${v.subiecte.map((s,si)=>`<section class="sec"><h3><span>Subiectul ${si+1}</span><span class="pts">${fmt(subMax(s))} p</span></h3>
  <p class="stem">${esc(s.stem)}</p>
  <ol class="qs">${s.items.map((it,ii)=>{const id=`r-${v.id}-${si}-${ii}`;return `<li><span class="lt">${LET[ii]}.</span><span class="qt">${esc(it.q)} <b class="pt">(${fmt(it.p[2])} p)</b></span>
   <textarea id="${id}" data-k="${v.id}.${si}.${ii}" aria-label="Răspunsul tău la ${si+1}${LET[ii]}" placeholder="Răspunsul tău">${esc(store.ans[`${v.id}.${si}.${ii}`]||"")}</textarea></li>`}).join("")}</ol></section>`).join("")}
 <div class="important"><b>IMPORTANT!</b><p>Timp: <span class="t">7 minute</span></p><p>Vă rugăm să nu puneți întrebări suplimentare examinatorului!</p><p>Punctajul maxim pe care îl puteți obține este 9; 1 punct este din oficiu.</p></div>
 </article>`;
}

/* barem */
function scoreOf(v){const sc=store.sc[v.id]||{};let pts=0,bon=0;
 v.subiecte.forEach((s,si)=>s.items.forEach((it,ii)=>{const x=sc[`${si}.${ii}`];if(x!=null)pts+=x}));
 if(sc.b!=null)bon=sc.b;return {pts,bon,nota:Math.min(10,pts+bon+1),n:Object.keys(sc).filter(k=>k!=="b").length}}
function pick(key,vals,cur){return `<div class="pick" role="group" aria-label="Punctaj">${vals.map(x=>`<button type="button" data-s="${key}" data-x="${x}" aria-pressed="${cur===x}">${fmt(x)}</button>`).join("")}</div>`}
function baremHtml(v){
 const sc=store.sc[v.id]||{};
 let h=`<article class="fisa" id="barem"><div class="fh"><b>O.S.P.E. – Barem de corectare · V${v.id}</b><span class="disc">Farmacologie</span><span class="meta">Facultatea de Medicină · Anul 2 · Modulul 1 · Disciplina: Farmacologie</span></div>
 <div class="practhint">Atinge un răspuns ca să-l vezi. Punctează-te înainte, dacă vrei să fii sincer cu tine.</div>
 <div class="bt" role="table" aria-label="Barem"><div class="br th" role="row"><div class="nr">Nr.</div><div>Activități</div><div class="c">0</div><div class="c">parțial</div><div class="c">maxim</div><div class="et">Punctaj etapă</div></div>`;
 v.subiecte.forEach((s,si)=>{
  h+=`<div class="br sh" role="row"><div class="nr">${si+1}</div><div class="act" style="grid-column:2/-1"><span class="tag k" style="justify-self:start">${DOM[s.dom]}</span><span class="st">${esc(s.stem)}</span><span class="sum">${fmt(subMax(s))} p</span></div></div>`;
  s.items.forEach((it,ii)=>{const key=`${si}.${ii}`;const mine=store.ans[`${v.id}.${si}.${ii}`];const vals=it.p.filter(x=>x!==null);
   const n=it.n?`<span class="nn">Cerute ${it.n} noțiuni · se iau în calcul doar primele ${Math.floor(it.n*1.5)}.</span>`:"";
   h+=`<div class="br" role="row"><div class="nr">${LET[ii]}</div><div class="act"><span class="ans">${ptsHtml(it.ans)}</span>${it.acc?`<span class="acc">Se acceptă: ${esc(it.acc)}</span>`:""}${n}
    ${mine&&mine.trim()?`<div class="mine"><b>Răspunsul tău</b>${esc(mine)}</div>`:""}<span class="srcs">${it.src.map(x=>srcBtn(`${v.id}.${si}.${ii}`,x)).join("")}</span></div>
    <div class="c">0</div><div class="c">${it.p[1]===null?"–":fmt(it.p[1])}</div><div class="c mx">${fmt(it.p[2])}</div><div class="et">${pick(key,vals,sc[key])}</div></div>`})});
 h+=`<div class="br bonus" role="row"><div class="nr"></div><div class="act"><span class="lab">PUNCT BONUS</span><span class="qq" style="font-size:.9rem">${esc(v.bonus.q)}</span><span class="ans">${esc(v.bonus.ans)}</span><span class="srcs">${v.bonus.src.map(x=>srcBtn(`${v.id}.b`,x)).join("")}</span></div>
  <div class="c">0</div><div class="c">–</div><div class="c mx">1</div><div class="et">${pick("b",[0,1],sc.b)}</div></div>`;
 const r=scoreOf(v);
 h+=`<div class="br tot" role="row"><div class="span">Total puncte (punctele obținute de student, echivalente cu maxim nota 9)</div><div class="val" id="vt">${fmt(r.pts)} / 9</div></div>
 <div class="br tot" role="row"><div class="span">Punct bonus</div><div class="val" id="vb">${fmt(r.bon)}</div></div>
 <div class="br tot of" role="row"><div class="span">Se acordă 1 punct din oficiu</div><div class="val">1</div></div>
 <div class="br tot" role="row"><div class="span">NOTĂ FINALĂ</div><div class="val" id="vn">${fmt(r.nota)}</div></div></div>
 <p class="rule"><b>Studentul poate răspunde cu maximum 50% mai multe noțiuni decât numărul solicitat în întrebare; doar primele noțiuni, până la această limită, vor fi luate în considerare la evaluare.</b> Exemplu: dacă se solicită <b>4 noțiuni</b>, vor fi luate în considerare la evaluare doar <b>primele 6 noțiuni</b> menționate de student.</p>
 <div class="sign">Semnătura examinatorului: <span>…………………………………………</span>Data: <span>………………………</span></div></article>`;
 return h;
}

let practice=false;
function plate(v,view){
 const i=VARIANTE.indexOf(v),prev=VARIANTE[i-1],next=VARIANTE[i+1];const r=scoreOf(v);
 app.innerHTML=`<nav class="bar" aria-label="Planșă"><div class="wrap">
  <a class="btn icon" href="#" aria-label="Înapoi la raft">←</a>
  <span class="ttl">Varianta ${v.id}</span>
  <div class="seg" role="group" aria-label="Vedere"><button type="button" data-view="fisa" aria-pressed="${view==="fisa"}">Fișă student</button><button type="button" data-view="barem" aria-pressed="${view==="barem"}">Barem</button></div>
  <button type="button" class="btn timer" id="tbtn" aria-live="polite"><span class="tl"></span><span class="tv"></span></button>
  <button type="button" class="btn" id="treset" hidden>Repornește</button>
  ${view==="barem"?`<button type="button" class="btn${practice?" on":""}" id="prac" aria-pressed="${practice}">Ascunde răspunsurile</button>`:""}
  <div class="score" id="score">${scorePills(r)}</div>
  <a class="btn icon" ${prev?`href="#v${prev.id}${view==="barem"?"-barem":""}"`:'aria-disabled="true" style="opacity:.4;pointer-events:none"'} aria-label="Varianta anterioară">‹</a>
  <a class="btn icon" ${next?`href="#v${next.id}${view==="barem"?"-barem":""}"`:'aria-disabled="true" style="opacity:.4;pointer-events:none"'} aria-label="Varianta următoare">›</a>
 </div></nav>
 <main class="wrap"><div class="plansa${practice&&view==="barem"?" practice":""}" id="pl">
  <header class="head"><div class="eyebrow">Farmacologie · Modulul 1 · O.S.P.E. · V${v.id}</div><h1>${esc(v.titlu)}</h1>
  <div class="sub">${v.subiecte.map((s,k)=>`${k+1}. ${DOM[s.dom]} · ${fmt(subMax(s))} p`).join("  ·  ")}  ·  bonus 1 p</div></header>
  ${view==="fisa"?fisaHtml(v):baremHtml(v)}
  ${view==="fisa"?`<div class="noprint" style="display:flex;justify-content:flex-end"><a class="btn on" href="#v${v.id}-barem">Am terminat · vezi baremul →</a></div>`:""}
 </div></main>`;
 tPaint();
 $("#tbtn").onclick=tToggle;$("#treset").onclick=tReset;
 app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{location.hash=`v${v.id}${b.dataset.view==="barem"?"-barem":""}`});
 app.querySelectorAll("textarea[data-k]").forEach(t=>t.oninput=()=>{store.ans[t.dataset.k]=t.value;save()});
 const p=$("#prac");if(p)p.onclick=()=>{practice=!practice;p.classList.toggle("on",practice);p.setAttribute("aria-pressed",practice);$("#pl").classList.toggle("practice",practice);app.querySelectorAll(".ans.shown").forEach(a=>a.classList.remove("shown"))};
 app.querySelectorAll(".act .ans").forEach(a=>a.onclick=()=>{if(practice)a.classList.add("shown")});
 app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const sc=store.sc[v.id]=store.sc[v.id]||{};const k=b.dataset.s,x=parseFloat(b.dataset.x);
  if(sc[k]===x)delete sc[k];else sc[k]=x;save();
  b.parentNode.querySelectorAll("button").forEach(o=>o.setAttribute("aria-pressed",sc[k]===parseFloat(o.dataset.x)));
  const r=scoreOf(v);$("#vt").textContent=fmt(r.pts)+" / 9";$("#vb").textContent=fmt(r.bon);$("#vn").textContent=fmt(r.nota);$("#score").innerHTML=scorePills(r)});
}
function scorePills(r){if(!r.n&&!r.bon)return `<span class="pill">9 p + 1 bonus</span>`;
 return `<span class="pill">${fmt(r.pts)} / 9 p</span><span class="pill ${r.nota>=5?"pass":"fail"}">nota ${fmt(r.nota)}</span>`}

/* versiune de tipar, ca foile oficiale */
function paperFisa(v){return `<div class="paper"><p class="ph1">Facultatea de Medicină, Anul 2, Modulul 1</p><p class="ph1">Disciplina: Farmacologie</p>
 <h2>O.S.P.E. – FIȘĂ STUDENT</h2><p class="vx">V${v.id}</p>
 <ol class="pq">${v.subiecte.map(s=>`<li>${esc(s.stem)}<ol>${s.items.map(it=>`<li>${esc(it.q)} <b>(${fmt(it.p[2])} p)</b></li>`).join("")}</ol></li>`).join("")}</ol>
 <div class="imp"><b>IMPORTANT!</b><br>Timp: <span class="red">7 minute</span><br>Vă rugăm să nu puneți întrebări suplimentare examinatorului!<br>Punctajul maxim pe care îl puteți obține este 9; 1 punct este din oficiu.</div></div>`}
function paperBarem(v){let rows="";
 v.subiecte.forEach((s,si)=>{rows+=`<tr class="s"><td colspan="6">${si+1}</td></tr>`;
  s.items.forEach((it,ii)=>{rows+=`<tr><td class="c">${LET[ii]}</td><td>${esc(it.ans).replace(/\((\d+(?:,\d+)?) p\)/g,"<b>($1 p)</b>")}${it.acc?`<br><span class="pn">Se acceptă: ${esc(it.acc)}</span>`:""}<br><span class="pn">${it.src.map(x=>esc(refLabel(`${v.id}.${si}.${ii}`,x))).join(" · ")}</span></td><td class="c">0</td><td class="c">${it.p[1]===null?"-":fmt(it.p[1])}</td><td class="c g">${fmt(it.p[2])}</td><td></td></tr>`})});
 rows+=`<tr><td></td><td class="blue">PUNCT BONUS: ${esc(v.bonus.ans)}</td><td class="c"></td><td class="c"></td><td class="c"><b>1</b></td><td></td></tr>`;
 return `<div class="paper"><p class="ph1">Facultatea de Medicină, Anul 2, Modulul 1</p><p class="ph1">Disciplina: Farmacologie</p>
 <h2>O.S.P.E. – BAREM DE CORECTARE</h2><p class="vx">V${v.id}</p><p class="ph1" style="margin-bottom:8px">Numele și prenumele studentului: ………………………………………………………</p>
 <table><thead><tr><th>Nr.</th><th>Activități</th><th colspan="3">Puncte/item<br><span class="pn">(0/parțial/maxim)</span></th><th>Punctaj /etapă</th></tr></thead><tbody>${rows}
 <tr><td colspan="5"><b>Total puncte (punctele obținute de student, echivalente cu maxim nota 9)</b></td><td></td></tr>
 <tr><td colspan="6" class="red">Se acordă 1 punct din oficiu</td></tr><tr><td colspan="6"><b>NOTĂ FINALĂ:</b></td></tr></tbody></table>
 <p class="rule"><b>Studentul poate răspunde cu maximum 50% mai multe noțiuni decât numărul solicitat în întrebare; doar primele noțiuni, până la această limită, vor fi luate în considerare la evaluare. Exemplu:</b> Dacă se solicită <b>4 noțiuni</b>, vor fi luate în considerare la evaluare doar <b>primele 6 noțiuni</b> menționate de student.</p>
 <p class="sg">Semnătura examinatorului: ……………………………………………</p><p class="sg">Data: ……………………</p></div>`}
function printBody(){return `<section class="chapter"><header><h2>Pentru tipar</h2><span class="eyebrow">fișă + barem pentru fiecare variantă</span></header>
 <p class="tip-note">Foile de mai jos copiază așezarea fișei și a baremului oficial. Fișierul PDF trimis odată cu planșele are exact aceste pagini, câte una pe foaie.</p>
 ${VARIANTE.map(v=>paperFisa(v)+paperBarem(v)).join("")}</section>`}

/* popup de surse, ca în Planșe Morfopatologie și Simulatorul OSPE Histologie:
   citatul din barem, slide-ul sau pagina cu pasajul evidențiat, răsfoire prin tot documentul */
const NPAGES={lp1:17,lp2:17,lp3:19,lp4:14,ospe:17};
const VTITLE={lp1:"LP 1 · Introducere – Farmacocinetică",lp2:"LP 2 · Introducere – Farmacocinetică",lp3:"LP 3 · Introducere – Farmacodinamie",lp4:"LP 4 · Farmacodinamie. Farmacotoxicologie",ospe:"Material OSPE · Farmacologie generală 2026–2027"};
const srcPath=(d,n)=>`src/${d}_${String(n).padStart(2,"0")}.webp`;
function itemAns(key){const [v,s,i]=key.split(".");const V=VARIANTE.find(x=>x.id==v);if(!V)return"";
 const a=s==="b"?V.bonus.ans:V.subiecte[+s].items[+i].ans;return a.replace(/\s*\(\d+(?:,\d+)? p\)/g,"")}
const POP={el:null,ret:null,
 open(head,body){this.close();this.ret=document.activeElement;const d=document.createElement("div");d.className="pop";
  d.innerHTML=`<div class="pop-in" role="dialog" aria-modal="true" aria-label="Sursa"><div class="pop-h">${head}<button type="button" class="btn icon" data-pclose aria-label="Închide">✕</button></div><div class="pop-b">${body}</div></div>`;
  document.body.appendChild(d);this.el=d;document.body.style.overflow="hidden";
  d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-pclose]"))this.close()});d.querySelector("[data-pclose]").focus();return d},
 close(){if(this.el){this.el.remove();this.el=null;document.body.style.overflow="";if(this.ret&&this.ret.isConnected)try{this.ret.focus({preventScroll:true})}catch(_){}}}};
addEventListener("keydown",e=>{if(!POP.el)return;if(e.key==="Escape"){e.stopImmediatePropagation();POP.close()}
 else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.stopImmediatePropagation();e.preventDefault();const b=POP.el.querySelector(`[data-nav="${e.key==="ArrowRight"?1:-1}"]`);if(b&&!b.disabled)b.click()}},true);
addEventListener("hashchange",()=>POP.close());
function openSource(ref){const r=SURSE.refs[ref];if(!r)return;const key=ref.split("|")[0];const quote=itemAns(key);
 const doc=r.d,p0=r.p,isLP=doc!=="ospe",N=NPAGES[doc],unit=isLP?"Slide-ul":"Pagina",where=isLP?"LP":"material";
 const st={p:p0,big:false};const marked=Object.keys(r.h).map(Number);
 if(!SURSE_IMG){const H=r.h[p0];
  POP.open(`<div class="vt"><span class="eyebrow">${esc(VTITLE[doc])}</span><b>${unit} ${p0} · sursa citată</b></div>`,
   `<div class="vq">${quote?`<blockquote class="pq">${esc(quote)}</blockquote>`:""}${H?`<div class="rx"><span class="eyebrow">Ce scrie în ${isLP?"LP":"material"}, ${unit.toLowerCase()} ${p0}</span><p><mark>${esc(H.q)}</mark></p></div>`:""}</div>
   <p class="pnote">Imaginea ${isLP?"slide-ului":"paginii"} nu e publicată aici, pentru că materialele de curs sunt de uz intern. O găsești în ${esc(VTITLE[doc])}, ${unit.toLowerCase()} ${p0}.</p>`);
  POP.el.querySelector(".pop-in").classList.add("txt");return}
 const d=POP.open(`<div class="vt"><span class="eyebrow">${esc(VTITLE[doc])}</span><b>${unit} ${p0} · sursa citată</b></div><div class="pop-act"><button type="button" class="btn sm" data-zoom aria-pressed="false">Mărește</button></div>`,
  `${quote?`<blockquote class="pq">${esc(quote)}</blockquote>`:""}<div id="vsl"></div><p class="pnote" id="vnote"></p>`);
 d.querySelector(".pop-in").insertAdjacentHTML("beforeend",`<nav class="pager" aria-label="Răsfoiește"><button type="button" class="btn" data-nav="-1" aria-label="${isLP?"Slide-ul":"Pagina"} anterior">‹<span> Înapoi</span></button><div class="pg"><span class="mono" id="vpn"></span><button type="button" class="btn sm home" data-home>Pasajul citat</button></div><button type="button" class="btn" data-nav="1" aria-label="${isLP?"Slide-ul":"Pagina"} următor"><span>Înainte </span>›</button></nav>`);
 const host=d.querySelector("#vsl"),note=d.querySelector("#vnote"),home=d.querySelector("[data-home]");
 const render=first=>{const atHome=st.p===p0;const H=r.h[st.p];
  host.className="slide"+(isLP?"":" rpage")+(st.big?" big":"");
  host.innerHTML=`<img src="${srcPath(doc,st.p)}" alt="${esc(VTITLE[doc])}, ${unit.toLowerCase()} ${st.p}" width="${isLP?1200:1000}" height="${isLP?675:1414}">`+(H?H.b.map(q=>`<i class="hl" style="left:${q[0]*100}%;top:${q[1]*100}%;width:${q[2]*100}%;height:${q[3]*100}%"></i>`).join(""):"");
  d.querySelector("#vpn").textContent=`${st.p} / ${N}`;
  home.classList.toggle("vis",!atHome);home.disabled=atHome;
  d.querySelector('[data-nav="-1"]').disabled=st.p<=1;d.querySelector('[data-nav="1"]').disabled=st.p>=N;
  note.textContent=H?`Pasajul evidențiat e locul din ${where} pe care se sprijină informația.`:atHome?`Informația se sprijină pe schema de pe ${unit.toLowerCase()} ${p0}; nu e scrisă cuvânt cu cuvânt aici.`:`Răsfoiești ${isLP?"LP-ul":"materialul"}; pasajul citat e la ${unit.toLowerCase()} ${marked.length?marked.join(" și "):p0}.`;
  if(first)requestAnimationFrame(()=>{const h=host.querySelector(".hl");if(h)h.scrollIntoView({block:"center",inline:"center"})});
  [st.p-1,st.p+1].forEach(m=>{if(m>=1&&m<=N){const i=new Image();i.src=srcPath(doc,m)}})};
 d.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{const m=st.p+ +b.dataset.nav;if(m<1||m>N)return;st.p=m;render(false)});
 home.onclick=()=>{st.p=p0;render(true)};
 const zb=d.querySelector("[data-zoom]");zb.onclick=()=>{st.big=!st.big;zb.setAttribute("aria-pressed",st.big);zb.textContent=st.big?"Micșorează":"Mărește";render(false)};
 let sx=null;host.addEventListener("touchstart",e=>{if(e.touches.length===1&&!st.big)sx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
 host.addEventListener("touchend",e=>{if(!sx)return;const t=e.changedTouches[0],dx=t.clientX-sx[0],dy=t.clientY-sx[1];sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)){const b=d.querySelector(`[data-nav="${dx<0?1:-1}"]`);if(!b.disabled)b.click()}},{passive:true});
 render(true)}
document.addEventListener("click",e=>{const b=e.target.closest("button.src[data-ref]");if(!b)return;e.preventDefault();openSource(b.dataset.ref)});

route();
})();
</script>
