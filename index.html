<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Planșe OSPE Farmacologie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Planșe (sistemul de design „Planșe”), disciplina farmacologie: raft de variante → planșă cu fișa student și baremul, lângă cronometru și scor. */
:root{
 --bg:#f2f1f6;--surface:#ffffff;--surface-2:#e9e7f1;--ink:#1d1a2c;--muted:#5d5973;--line:#d8d5e3;
 --accent:#3b2d91;--accent-soft:#e3dff7;--on-accent:#ffffff;--required:#c42f66;--required-soft:#fbe2eb;
 --discipline:#7a5a00;--discipline-soft:#f6eccb;--ok:#17744a;--ok-soft:#dcf1e5;--frost:#f7f8fa;
 --shadow:0 1px 2px rgba(29,26,44,.06),0 12px 28px -20px rgba(29,26,44,.45);
 --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
 --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121019;--surface:#1a1724;--surface-2:#242031;--ink:#ece9f6;--muted:#a39eb8;--line:#312c42;
 --accent:#afa2ff;--accent-soft:#2a2550;--on-accent:#15112e;--required:#ff7ea8;--required-soft:#3d1b29;
 --discipline:#e6be4a;--discipline-soft:#352a0c;--ok:#5ed39a;--ok-soft:#14321f;--frost:#2a2836;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.9);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121019;--surface:#1a1724;--surface-2:#242031;--ink:#ece9f6;--muted:#a39eb8;--line:#312c42;
 --accent:#afa2ff;--accent-soft:#2a2550;--on-accent:#15112e;--required:#ff7ea8;--required-soft:#3d1b29;
 --discipline:#e6be4a;--discipline-soft:#352a0c;--ok:#5ed39a;--ok-soft:#14321f;--frost:#2a2836;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.9);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* raft */
.masthead{padding-block:28px 10px;display:grid;gap:14px}
.masthead h1{font-size:clamp(1.9rem,5.4vw,3.1rem);font-weight:800}
.masthead h1 i{font-style:normal;color:var(--discipline)}
/* întoarcere la hub (designul Planșe: HubLink) */
.hub{display:inline-flex;align-items:center;gap:6px;width:max-content;min-height:36px;margin:-6px 0 -10px -8px;padding:0 10px 0 8px;border-radius:8px;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.03em;color:var(--accent);text-decoration:none}
.hub:hover{background:var(--accent-soft)}
.lede{color:var(--muted);max-width:66ch;margin:0}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px}
.seg{display:inline-flex;gap:3px;background:var(--surface-2);border-radius:11px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted);white-space:nowrap;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chapter{padding-block:22px 6px}
.chapter>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.chapter h2{font-size:1.35rem;font-weight:700}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
.jar{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .18s ease,border-color .18s ease;min-width:0}
.jar:hover{transform:translateY(-2px);border-color:var(--accent)}
.jar .ph{position:relative;aspect-ratio:16/7;background:var(--discipline-soft);overflow:hidden}
.jar .glyph{position:absolute;inset:0;display:grid;place-items:center;color:var(--discipline);font-family:var(--f-display);font-weight:800;font-size:2.6rem;letter-spacing:-.01em;line-height:1}
.jar .ph .done{position:absolute;right:10px;top:10px;font:600 .7rem/1 var(--f-mono);padding:4px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.jar .body{padding:12px 14px 4px;display:grid;gap:4px;flex:1}
.jar h3{font-size:1.06rem;font-weight:700}
.jar .org{color:var(--muted);font-size:.86rem;line-height:1.35}
.label{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:5px;background:var(--frost);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.tag.k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--discipline)}
.disc{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:5px;background:var(--discipline-soft);color:var(--discipline);white-space:nowrap}
.disc::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--discipline)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;color:var(--muted);font-size:.92rem}
.steps li b{color:var(--ink);font-weight:600}
.steps .n{font:600 .78rem/1 var(--f-mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-top:1px}
.foot{padding-block:28px 60px;color:var(--muted);font-size:.86rem;display:grid;gap:8px}.foot>div{max-width:80ch}

/* planșă */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;padding-block:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.9rem;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.icon{padding:7px 10px;min-width:38px;justify-content:center}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:default}
.bar .ttl{flex:1 1 140px;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.78rem;flex-wrap:wrap}
.score .pill{padding:4px 8px;border-radius:999px;background:var(--surface-2);font-weight:600;font-variant-numeric:tabular-nums}
.score .pill.pass{background:var(--ok-soft);color:var(--ok)}
.score .pill.fail{background:var(--required-soft);color:var(--required)}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--required);color:var(--required)}
.timer.out{background:var(--required-soft);border-color:var(--required);color:var(--required)}
.plansa{display:grid;gap:22px;padding-block:18px 60px;grid-template-columns:minmax(0,1fr);max-width:880px;margin-inline:auto}
.head{display:grid;gap:6px}
.head h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800}
.head .sub{color:var(--muted);font-size:.92rem}

/* fișa */
.fisa{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fisa .fh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fisa .fh b{font-family:var(--f-display);font-size:1.05rem}
.fisa .fh .meta{color:var(--muted);font-size:.86rem;flex-basis:100%}
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec>h3{font-family:var(--f-body);font-size:.92rem;font-weight:600;padding:10px 16px;background:var(--surface-2);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sec>h3 .pts{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-weight:600}
.stem{padding:12px 16px 4px;margin:0;max-width:70ch}
.qs{list-style:none;margin:0;padding:6px 16px 14px;display:grid;gap:12px}
.qs>li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:4px 6px}
.qs .lt{font-family:var(--f-mono);font-weight:600;color:var(--muted);padding-top:1px}
.qs .qt{min-width:0}
.pt{font-family:var(--f-mono);font-weight:600;font-size:.86em;white-space:nowrap}
.qs textarea{grid-column:2;width:100%;min-height:3.2em;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:.94rem;line-height:1.45}
.qs textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.important{margin:0;padding:14px 16px;border-top:1px solid var(--line);background:var(--required-soft);display:grid;gap:2px}
.important b{color:var(--required);font-family:var(--f-mono);letter-spacing:.06em;font-size:.8rem}
.important p{margin:0;font-size:.92rem}
.important .t{color:var(--required);font-weight:600}

/* barem */
.bt{display:grid}
.br{display:grid;grid-template-columns:2.2rem minmax(0,1fr) repeat(3,3.1rem) 7.6rem;border-top:1px solid var(--line);align-items:stretch}
.br>div{padding:9px 8px;min-width:0}
.br .c{text-align:center;font-family:var(--f-mono);font-size:.86rem;font-variant-numeric:tabular-nums;border-left:1px solid var(--line)}
.br .c.mx{background:var(--surface-2);font-weight:600}
.br .et{border-left:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center}
.br .nr{font-family:var(--f-mono);font-weight:600;text-align:center}
.br.th{background:var(--surface-2);font-weight:600;font-size:.84rem;border-top:0}
.br.th .c{font-family:var(--f-body);font-size:.78rem;font-weight:600;background:transparent}
.br.th .c small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.br.sh{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.br.sh .act{display:grid;gap:4px}
.br.sh .st{color:var(--muted);font-size:.86rem;max-width:70ch}
.br.sh .sum{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted)}
.act{display:grid;gap:5px}
.act .ans{display:block}
.act .acc,.act .nn{font-size:.84rem;color:var(--muted)}
.act .srcs{display:flex;flex-wrap:wrap;gap:5px}
.src-k{font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--accent);background:var(--surface);white-space:nowrap}
.src-k.o{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.mine{font-size:.86rem;background:var(--accent-soft);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.mine b{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block}
.pick{display:inline-flex;gap:3px;background:var(--surface-2);border-radius:9px;padding:3px}
.pick button{appearance:none;border:0;background:transparent;border-radius:7px;min-width:30px;min-height:32px;padding:4px 6px;font:600 .78rem/1 var(--f-mono);cursor:pointer;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.br.bonus .act .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;color:var(--accent);font-weight:600}
.br.bonus .ans{color:var(--accent)}
.br.tot{font-weight:600;font-size:.92rem}
.br.tot .span{grid-column:1/-2;padding-left:12px}
.br.tot .val{border-left:1px solid var(--line);text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.br.tot.of .span{color:var(--required)}
.rule{margin:0;padding:12px 16px;border-top:1px solid var(--line);color:var(--required);font-size:.86rem}
.rule b{font-weight:600}
.sign{display:grid;gap:10px;padding:14px 16px;border-top:1px solid var(--line);font-size:.9rem;font-weight:600}
.sign span{font-weight:400;color:var(--muted)}
.practice .ans{filter:blur(6px);opacity:.55;transition:filter .2s,opacity .2s;cursor:pointer;user-select:none}
.practice .ans.shown{filter:none;opacity:1;cursor:auto;user-select:auto}
.practhint{display:none;padding:10px 16px;font-size:.86rem;background:var(--accent-soft);color:var(--ink)}
.practice .practhint{display:block}
@media (prefers-reduced-motion:reduce){.jar,.practice .ans{transition:none}}
@media (max-width:640px){
 .br{grid-template-columns:1.8rem minmax(0,1fr)}
 .br .c{display:none}
 .br .et{grid-column:2/-1;border-left:0;justify-content:flex-start;padding-top:0}
 .br.th .et{display:none}
 .br.tot{grid-template-columns:minmax(0,1fr) auto}
 .br.tot .span{grid-column:auto}
 .br.tot .val{min-width:5rem}
 .pick::before{content:"puncte";font:500 .7rem/32px var(--f-mono);color:var(--muted);padding:0 6px}
}
/* matrice */
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.mx{border-collapse:collapse;width:100%;min-width:1180px;font-size:.88rem}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
.mx thead th{background:var(--surface-2);font:600 .78rem/1.2 var(--f-mono);position:sticky;top:0}
.mx th[scope="row"],.mx td.nm{text-align:left;font-weight:500}.mx th[scope="row"]{width:1%}
.mx td.nm{color:var(--muted);font-size:.84rem}
.mx .grp th{background:color-mix(in srgb,var(--discipline-soft) 70%,var(--surface));text-align:left;font:600 .74rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--discipline)}
.mx .hit{display:inline-grid;place-items:center;width:1.7rem;height:1.4rem;border-radius:5px;background:var(--accent-soft);color:var(--accent);font:600 .7rem/1 var(--f-mono)}
.mx .zero th,.mx .zero td.nm{color:var(--required)}
.mx tfoot td,.mx tfoot th{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface-2)}
a.vl{color:inherit;text-decoration:none}a.vl:hover{color:var(--accent)}

/* tipar */
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 32px;max-width:820px;margin:0 auto 22px;font-size:14px;line-height:1.45}
.paper .ph1{font-weight:600;margin:0}
.paper h2{font-family:var(--f-body);color:#1f5fa8;text-align:center;font-size:17px;margin:14px 0 2px}
.paper .vx{color:#1f5fa8;text-align:center;font-weight:700;margin:0 0 14px}
.paper ol.pq{margin:0;padding-left:20px;display:grid;gap:10px}
.paper ol.pq ol{list-style:lower-alpha;padding-left:22px;margin:6px 0 0;display:grid;gap:3px}
.paper .imp{border-top:2px solid #1f5fa8;margin-top:18px;padding-top:8px}
.paper .imp b{color:#1f5fa8}.paper .red{color:#c0161f;font-weight:700}
.paper table{border-collapse:collapse;width:100%;font-size:12.5px}
.paper td,.paper th{border:1px solid #333;padding:4px 6px;vertical-align:top}
.paper th{font-weight:700}
.paper td.c{text-align:center;width:42px}.paper td.c.g{background:#c8c8c8;font-weight:700}
.paper tr.s td{background:#dbe3f1;font-weight:700}
.paper .blue{color:#1f5fa8}
.paper .rule{color:#c0161f;border:0;padding:8px 0 0;font-size:12px}
.paper .sg{margin-top:14px;font-weight:700}
.paper .pn{color:#555;font-size:11px}
.tip-note{color:var(--muted);font-size:.9rem;max-width:70ch;margin:0 auto 18px}
@media print{
 :root{--bg:#fff;--surface:#fff;--surface-2:#eee;--ink:#111;--muted:#444;--line:#999;color-scheme:light}
 .tools,.bar,.masthead,.foot,.tip-note,.noprint{display:none!important}
 body{background:#fff}
 .paper{border:0;border-radius:0;margin:0;max-width:none;padding:0;break-after:page}
 .qs textarea{display:none}
 .chapter>header{display:none}
 .chapter{padding:0}
 .paper table{font-size:10.4px;line-height:1.3}
 .paper td,.paper th{padding:2.5px 5px}
 .paper .pn{font-size:9.2px}
 .paper .rule{font-size:10.5px}
 .paper .sg{margin-top:8px}
 .paper h2{margin-top:8px}
}
</style>

<div id="app"></div>

<script>
// Variante OSPE Farmacologie generală · Anul II MG · Modulul 1
// Fiecare item: q = cerința din fișa student; ans = răspunsul din barem (cu „(x p)” pentru fiecare noțiune);
// acc = formulări echivalente acceptate; p = [0, parțial|null, maxim]; n = noțiuni cerute (regula 50%);
// src = trimiteri la LP (cazul) și la Materialul OSPE (pagina); dom = FC | FD | FT.
const VARIANTE = [
{
 id: 1, titlu: "Peptid oral · agonist β2 · down-regulation",
 subiecte: [
  { dom: "FC", stem: "Un medicament cu structură peptidică se administrează per os. Se recoltează probe de sânge la 20, 40, 60 și 90 de minute, iar concentrația plasmatică a medicamentului este 0 μg/mL la toate recoltările.",
    items: [
     { q: "Explicați valorile concentrației plasmatice.", ans: "Substanța nu se absoarbe, nu ajunge în sânge (0,5 p); este degradată de proteazele din tractul gastro-intestinal înainte de a traversa membranele (0,5 p).", acc: "„inactivată de enzimele digestive”, „scindată în fragmente de peptide și aminoacizi”.", p: [0, 0.5, 1], src: ["LP 1 · c1"] },
     { q: "Ce parametru farmacocinetic primar caracterizează absorbția și ce valoare are în acest caz?", ans: "Biodisponibilitatea (Bd, F) (0,5 p); practic nulă, ≈ 0% (0,5 p).", acc: "„Bd = 0”, „nu este biodisponibil oral”.", p: [0, 0.5, 1], src: ["LP 1 · c1", "OSPE p.1"] },
     { q: "Numiți două condiții pe care trebuie să le îndeplinească o substanță ca să poată traversa membranele biologice.", ans: "Oricare două, câte 0,5 p: liposolubilă (coeficient de repartiție octanol/apă); neionizată (depinde de pH și pKa); nelegată de proteine.", acc: "„lipofilă”, „nepolară”, „fracția liberă”.", p: [0, 0.5, 1], n: 2, src: ["LP 1 · De reținut"] }
    ]},

<script>

/* cronometru (7 minute, ca la examen) */
const T={left:420,run:false,id:null,v:null};
function tStr(){const m=Math.floor(T.left/60),s=T.left%60;return m+":"+String(s).padStart(2,"0")}
function tPaint(){const b=$("#tbtn");if(!b)return;
 b.classList.toggle("low",T.left<=60&&T.left>0);b.classList.toggle("out",T.left===0);
 b.querySelector(".tv").textContent=T.left===0?"timp expirat":tStr();
 b.querySelector(".tl").textContent=T.left===0?"":T.run?"Pauză":(T.left<420?"Reia":"Pornește");
 const r=$("#treset");if(r)r.hidden=T.left===420&&!T.run}
function tToggle(){if(T.left===0)return;T.run=!T.run;
 if(T.run){T.id=setInterval(()=>{T.left=Math.max(0,T.left-1);if(T.left===0){clearInterval(T.id);T.run=false}tPaint()},1000)}
 else clearInterval(T.id);tPaint()}
function tReset(){clearInterval(T.id);T.run=false;T.left=420;tPaint()}

  <a class="btn icon" href="#" aria-label="Înapoi la raft">←</a>
  <span class="ttl">Varianta ${v.id}</span>
  <div class="seg" role="group" aria-label="Vedere"><button type="button" data-view="fisa" aria-pressed="${view==="fisa"}">Fișă student</button><button type="button" data-view="barem" aria-pressed="${view==="barem"}">Barem</button></div>
  <button type="button" class="btn timer" id="tbtn" aria-live="polite"><span class="tl"></span><span class="tv"></span></button>
  <button type="button" class="btn" id="treset" hidden>Repornește</button>
  ${view==="barem"?`<button type="button" class="btn${practice?" on":""}" id="prac" aria-pressed="${practice}">Ascunde răspunsurile</button>`:""}
  <div class="score" id="score">${scorePills(r)}</div>
  <a class="btn icon" ${prev?`href="#v${prev.id}${view==="barem"?"-barem":""}"`:'aria-disabled="true" style="opacity:.4;pointer-events:none"'} aria-label="Varianta anterioară">‹</a>
  <a class="btn icon" ${next?`href="#v${next.id}${view==="barem"?"-barem":""}"`:'aria-disabled="true" style="opacity:.4;pointer-events:none"'} aria-label="Varianta următoare">›</a>
 </div></nav>
 <main class="wrap"><div class="plansa${practice&&view==="barem"?" practice":""}" id="pl">
  <header class="head"><div class="eyebrow">Farmacologie · Modulul 1 · O.S.P.E. · V${v.id}</div><h1>${esc(v.titlu)}</h1>
  <div class="sub">${v.subiecte.map((s,k)=>`${k+1}. ${DOM[s.dom]} · ${fmt(subMax(s))} p`).join("  ·  ")}  ·  bonus 1 p</div></header>
  ${view==="fisa"?fisaHtml(v):baremHtml(v)}
  ${view==="fisa"?`<div class="noprint" style="display:flex;justify-content:flex-end"><a class="btn on" href="#v${v.id}-barem">Am terminat · vezi baremul →</a></div>`:""}
 </div></main>`;
 tPaint();
 $("#tbtn").onclick=tToggle;$("#treset").onclick=tReset;
 app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{location.hash=`v${v.id}${b.dataset.view==="barem"?"-barem":""}`});
 app.querySelectorAll("textarea[data-k]").forEach(t=>t.oninput=()=>{store.ans[t.dataset.k]=t.value;save()});
 const p=$("#prac");if(p)p.onclick=()=>{practice=!practice;p.classList.toggle("on",practice);p.setAttribute("aria-pressed",practice);$("#pl").classList.toggle("practice",practice);app.querySelectorAll(".ans.shown").forEach(a=>a.classList.remove("shown"))};
 app.querySelectorAll(".act .ans").forEach(a=>a.onclick=()=>{if(practice)a.classList.add("shown")});
 app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const sc=store.sc[v.id]=store.sc[v.id]||{};const k=b.dataset.s,x=parseFloat(b.dataset.x);
  if(sc[k]===x)delete sc[k];else sc[k]=x;save();
  b.parentNode.querySelectorAll("button").forEach(o=>o.setAttribute("aria-pressed",sc[k]===parseFloat(o.dataset.x)));
  const r=scoreOf(v);$("#vt").textContent=fmt(r.pts)+" / 9";$("#vb").textContent=fmt(r.bon);$("#vn").textContent=fmt(r.nota);$("#score").innerHTML=scorePills(r)});
}
function scorePills(r){if(!r.n&&!r.bon)return `<span class="pill">9 p + 1 bonus</span>`;
 return `<span class="pill">${fmt(r.pts)} / 9 p</span><span class="pill ${r.nota>=5?"pass":"fail"}">nota ${fmt(r.nota)}</span>`}

/* versiune de tipar, ca foile oficiale */
function paperFisa(v){return `<div class="paper"><p class="ph1">Facultatea de Medicină, Anul 2, Modulul 1</p><p class="ph1">Disciplina: Farmacologie</p>
 <h2>O.S.P.E. – FIȘĂ STUDENT</h2><p class="vx">V${v.id}</p>
 <ol class="pq">${v.subiecte.map(s=>`<li>${esc(s.stem)}<ol>${s.items.map(it=>`<li>${esc(it.q)} <b>(${fmt(it.p[2])} p)</b></li>`).join("")}</ol></li>`).join("")}</ol>
 <div class="imp"><b>IMPORTANT!</b><br>Timp: <span class="red">7 minute</span><br>Vă rugăm să nu puneți întrebări suplimentare examinatorului!<br>Punctajul maxim pe care îl puteți obține este 9; 1 punct este din oficiu.</div></div>`}
function paperBarem(v){let rows="";
 v.subiecte.forEach((s,si)=>{rows+=`<tr class="s"><td colspan="6">${si+1}</td></tr>`;
  s.items.forEach((it,ii)=>{rows+=`<tr><td class="c">${LET[ii]}</td><td>${esc(it.ans).replace(/\((\d+(?:,\d+)?) p\)/g,"<b>($1 p)</b>")}${it.acc?`<br><span class="pn">Se acceptă: ${esc(it.acc)}</span>`:""}<br><span class="pn">${it.src.map(esc).join(" · ")}</span></td><td class="c">0</td><td class="c">${it.p[1]===null?"-":fmt(it.p[1])}</td><td class="c g">${fmt(it.p[2])}</td><td></td></tr>`})});
 rows+=`<tr><td></td><td class="blue">PUNCT BONUS: ${esc(v.bonus.ans)}</td><td class="c"></td><td class="c"></td><td class="c"><b>1</b></td><td></td></tr>`;
 return `<div class="paper"><p class="ph1">Facultatea de Medicină, Anul 2, Modulul 1</p><p class="ph1">Disciplina: Farmacologie</p>
 <h2>O.S.P.E. – BAREM DE CORECTARE</h2><p class="vx">V${v.id}</p><p class="ph1" style="margin-bottom:8px">Numele și prenumele studentului: ………………………………………………………</p>
 <table><thead><tr><th>Nr.</th><th>Activități</th><th colspan="3">Puncte/item<br><span class="pn">(0/parțial/maxim)</span></th><th>Punctaj /etapă</th></tr></thead><tbody>${rows}
 <tr><td colspan="5"><b>Total puncte (punctele obținute de student, echivalente cu maxim nota 9)</b></td><td></td></tr>
 <tr><td colspan="6" class="red">Se acordă 1 punct din oficiu</td></tr><tr><td colspan="6"><b>NOTĂ FINALĂ:</b></td></tr></tbody></table>
 <p class="rule"><b>Studentul poate răspunde cu maximum 50% mai multe noțiuni decât numărul solicitat în întrebare; doar primele noțiuni, până la această limită, vor fi luate în considerare la evaluare. Exemplu:</b> Dacă se solicită <b>4 noțiuni</b>, vor fi luate în considerare la evaluare doar <b>primele 6 noțiuni</b> menționate de student.</p>
 <p class="sg">Semnătura examinatorului: ……………………………………………</p><p class="sg">Data: ……………………</p></div>`}
function printBody(){return `<section class="chapter"><header><h2>Pentru tipar</h2><span class="eyebrow">fișă + barem pentru fiecare variantă</span></header>
 <p class="tip-note">Foile de mai jos copiază așezarea fișei și a baremului oficial. Fișierul PDF trimis odată cu planșele are exact aceste pagini, câte una pe foaie.</p>
 ${VARIANTE.map(v=>paperFisa(v)+paperBarem(v)).join("")}</section>`}

route();
})();
</script>

</body>
